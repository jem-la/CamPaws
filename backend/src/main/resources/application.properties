spring.application.name=campaws
server.port=${PORT:8080}
campaws.map.grid-degrees=0.003
campaws.photos.dir=${CAMPAWS_PHOTOS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Database (PostgreSQL + PostGIS) ---
# Defaults match compose.yaml for local development. On ./gradlew bootRun, Spring Boot starts
# compose.yaml and connects to it automatically. Override with env vars for other databases.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${CAMPAWS_DB_PORT:55432}/campaws}
spring.datasource.username=${DATABASE_USERNAME:campaws}
spring.datasource.password=${DATABASE_PASSWORD:campaws}
# Keep the database running after the app stops, so restarts are fast and data stays.
spring.docker.compose.lifecycle-management=start-only

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
